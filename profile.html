<!DOCTYPE html>
<html lang="en">
<head>
  <style>html { visibility: hidden; }</style>
  <script src="js/app-config.js?v=20260609e"></script>
  <script src="js/routes.js?v=20260702c"></script>
  <script src="js/auth-guard.js?v=20260704a"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — SelectAI</title>
  <link rel="icon" type="image/png" href="assets/images/logo-mark.png" />
  <link rel="stylesheet" href="css/style.css?v=20260704a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="scroll-progress" aria-hidden="true"></div>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/#hero" class="logo logo-img" aria-label="SelectAI home">
        <img src="assets/images/logo-black.png" alt="SelectAI" height="42" width="auto" />
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/#services">Services</a></li>
        <li><a href="/#partners">Partners</a></li>
        <li><a href="/#team">Team</a></li>
        <li><a href="/#capabilities">Why Us</a></li>
        <li><a href="/#live-metrics">Live KPI</a></li>
        <li><a href="/#feedback">Stories</a></li>
        <li><a href="/tools">AI Tools</a></li>
        <li id="adminNavItem" style="display:none;"><a href="/admin">Admin</a></li>
        <li><a href="/#connect" class="nav-cta">Connect</a></li>
        <li class="nav-signin-item" id="navSignInItem">
          <a href="/sign-in" class="nav-signin-btn">Sign In</a>
        </li>
        <li class="nav-user-item" id="navUserItem">
          <button class="nav-user-btn" id="navUserBtn" onclick="toggleUserMenu()" aria-label="User menu" aria-haspopup="true" aria-expanded="false" aria-controls="navUserDropdown">
            <span class="nav-user-avatar-wrap">
              <img id="navUserAvatar" src="" alt="" class="nav-user-photo" style="display:none;" />
              <svg id="navUserIcon" class="nav-user-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <svg class="nav-user-chevron" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M0 3l5 5 5-5z"/></svg>
          </button>
          <div class="nav-user-dropdown" id="navUserDropdown">
            <p class="nav-user-dropdown-hd" id="navUserDropdownName">Account</p>
            <div id="navUserAuthed">
              <a href="/profile" aria-current="page">Profile</a>
              <a href="/sign-in?forgot=1">Password Reset</a>
              <hr class="nav-user-dropdown-divider" />
              <a href="#" onclick="signOutUser(); return false;">Sign Out</a>
            </div>
          </div>
        </li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <section class="section profile-section">
    <div class="container" style="max-width: 560px;">
      <div class="section-header animate-on-scroll" style="text-align: left; margin-bottom: 2rem;">
        <span class="section-tag">Account</span>
        <h2>My <span class="gradient-text">Profile</span></h2>
      </div>

      <div class="profile-card animate-on-scroll">
        <div class="profile-card-avatar" id="profileAvatarWrap">
          <img id="profileAvatar" src="" alt="" style="display:none;" />
          <svg id="profileAvatarIcon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>

        <p class="profile-msg" id="profileMsg" aria-live="polite"></p>

        <form id="profileForm" class="profile-form" onsubmit="return false;" novalidate>
          <div class="profile-form-row">
            <div class="profile-field">
              <label for="profileFirstName">First Name</label>
              <input type="text" id="profileFirstName" name="firstName" autocomplete="given-name" minlength="2" required />
            </div>
            <div class="profile-field">
              <label for="profileLastName">Last Name</label>
              <input type="text" id="profileLastName" name="lastName" autocomplete="family-name" minlength="2" required />
            </div>
          </div>
          <div class="profile-field">
            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" readonly disabled aria-readonly="true" />
          </div>
          <div class="profile-field" id="profilePhoneField">
            <label for="profilePhone">Mobile Number</label>
            <input type="tel" id="profilePhone" readonly disabled aria-readonly="true" />
          </div>
          <div class="profile-field">
            <label for="profileVerified">Status</label>
            <input type="text" id="profileVerified" readonly disabled aria-readonly="true" />
          </div>
        </form>

        <div class="profile-card-actions">
          <button type="button" class="btn btn-primary" id="profileSaveBtn" onclick="saveProfile()">Save Changes</button>
          <a href="/sign-in?forgot=1" class="btn btn-outline">Reset Password</a>
          <a href="/" class="btn btn-outline">Back to Home</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/api.js?v=20260626a"></script>
  <script src="js/main.js?v=20260625a"></script>
  <script src="js/nav-user.js?v=20260628a"></script>
  <script>
    function formatPhone(digits) {
      if (!digits) return '—';
      return digits.replace(/(\d{3,5})(?=\d)/g, '$1 ').trim();
    }

    function isIndiaCountry(country) {
      var c = String(country || '').trim().toUpperCase();
      return c === 'IN' || c === 'INDIA';
    }

    function applyProfile(u) {
      window.SELECTAI_USER = Object.assign({}, window.SELECTAI_USER || {}, u);
      document.getElementById('profileFirstName').value = u.firstName || '';
      document.getElementById('profileLastName').value  = u.lastName  || '';
      document.getElementById('profileEmail').value     = u.email     || '—';
      document.getElementById('profilePhone').value     = formatPhone(u.phone || '');
      document.getElementById('profileVerified').value  = u.verified ? 'Verified' : 'Pending verification';

      var phoneWrap = document.getElementById('profilePhoneField');
      if (phoneWrap) {
        phoneWrap.hidden = !isIndiaCountry(u.country) && !(u.phone || '').trim();
      }

      var nameEl = document.getElementById('navUserDropdownName');
      if (nameEl) {
        var name = ((u.firstName || '') + ' ' + (u.lastName || '')).trim();
        nameEl.textContent = name || u.email || '';
      }

      if (u.photoURL) {
        var img = document.getElementById('profileAvatar');
        img.src = u.photoURL;
        img.style.display = 'block';
        document.getElementById('profileAvatarIcon').style.display = 'none';
      }
    }

    function loadProfile() {
      SelectAI_API.getMe()
        .then(function (res) {
          if (res && res.user) applyProfile(res.user);
        })
        .catch(function () {
          if (window.SELECTAI_USER) applyProfile(window.SELECTAI_USER);
        });
    }

    function setProfileMsg(text, isError) {
      var el = document.getElementById('profileMsg');
      el.textContent = text || '';
      el.className = 'profile-msg' + (text ? (isError ? ' err' : ' ok') : '');
    }

    function saveProfile() {
      var firstName = (document.getElementById('profileFirstName').value || '').trim();
      var lastName  = (document.getElementById('profileLastName').value  || '').trim();
      if (firstName.length < 2) { setProfileMsg('First name must be at least 2 characters.', true); return; }
      if (lastName.length  < 2) { setProfileMsg('Last name must be at least 2 characters.', true); return; }

      var btn = document.getElementById('profileSaveBtn');
      btn.disabled = true;
      setProfileMsg('');

      SelectAI_API.updateProfile({ firstName: firstName, lastName: lastName })
        .then(function (res) {
          applyProfile(res.user || { firstName: firstName, lastName: lastName });
          setProfileMsg(res.message || 'Profile updated.');
        })
        .catch(function (err) {
          setProfileMsg(err.message || 'Failed to update profile.', true);
        })
        .finally(function () { btn.disabled = false; });
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
